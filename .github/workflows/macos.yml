name: macOS build and test
on:
  push:
    branches: ['codex/**', main, master]
    paths: ['macos/**', '.github/workflows/macos.yml']
    tags: ['macos-v*']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check native architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Test core and compile app
        working-directory: macos
        run: swift test
      - name: Build universal app and installers
        run: |
          if [[ "$GITHUB_REF" == refs/tags/macos-v* ]]; then
            export VERSION="${GITHUB_REF_NAME#macos-v}"
          fi
          bash macos/build.sh
      - name: Verify both binary slices and native launch
        run: |
          lipo -info macos/dist/InputBeacon.app/Contents/MacOS/InputBeacon
          macos/dist/InputBeacon.app/Contents/MacOS/InputBeacon --self-check
          macos/dist/InputBeacon.app/Contents/MacOS/InputBeacon --ui-smoke
          macos/dist/InputBeacon.app/Contents/MacOS/InputBeacon --render-preview macos/dist/overlay-preview.png
      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: macOS-preview-${{ matrix.arch }}
          path: macos/dist/overlay-preview.png
      - name: Upload universal installers
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg
            macos/dist/SHA256SUMS.txt
          if-no-files-found: error

  sogou:
    name: Real Sogou compatibility
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check real Sogou internal Chinese and English states
        run: bash macos/scripts/test-sogou.sh

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: [test, sogou]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macOS-universal
          path: installers
      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --latest=false \
            --title "InputBeacon macOS ${GITHUB_REF_NAME#macos-v} · Intel / Apple Silicon" \
            --notes-file macos/RELEASE_NOTES.md
